# Example config for:
#   bash sglang_run_bench.sh --config-yaml eval_config/two_gpu_example.yaml
#
# Each item under jobs is launched as an independent benchmark process.
# The launcher sets CUDA_VISIBLE_DEVICES to the job's gpu value.
#
# Defaults when omitted:
#   tp_size: 1
#   mem_fraction_static: 0.75
#
# If draft_model is omitted/null/empty, the job runs baseline only.
# If draft_model contains "eagle3", the launcher automatically uses EAGLE3
# and adds:
#   --speculative-num-steps 15
#   --speculative-eagle-topk 1
#   --speculative-num-draft-tokens 16

jobs:
  - name: gpu0
    gpu: 0
    target_model: /mnt/shared-storage-user/p1-shared/Qwen/Qwen3-8B
    draft_model: /mnt/shared-storage-gpfs2/p1-shared-2/leihaodi/opd-draft/qwen3-8b/16k_global_step_5500_draft
    output_md: /mnt/shared-storage-user/leihaodi/diffusion/dflash/sglang-logs-final/gpu0.md
    dataset_name: ["aime24:30", "math500:128", "gsm8k:128", "mbpp:128", "humaneval:128", "aime25:30", "alpaca:128", "mt-bench:80", "mgsm_zh:32", "swe-bench:128"]
    concurrency_num: 1
    add_base: false
    enable_think: true
    attention_backends: fa3
    max_new_tokens: 8192

  - name: gpu1
    gpu: 1
    target_model: /mnt/shared-storage-user/p1-shared/Qwen/Qwen3-4B
    draft_model: /mnt/shared-storage-gpfs2/p1-shared-2/leihaodi/opd-draft/qwen3-4b/16k_global_step_5000_draft
    output_md: /mnt/shared-storage-user/leihaodi/diffusion/dflash/sglang-logs-final/gpu1.md
    dataset_name: ["aime24:30", "math500:128", "gsm8k:128", "mbpp:128", "humaneval:128", "aime25:30", "alpaca:128", "mt-bench:80", "mgsm_zh:32", "swe-bench:128"]
    concurrency_num: "1"
    enable_think: true
    attention_backends: fa3
    max_new_tokens: 8192

  - name: gpu2
    gpu: 2
    target_model: /mnt/shared-storage-user/p1-shared/Qwen/Qwen3-30B-A3B-Thinking-2507
    draft_model: /mnt/shared-storage-user/leihaodi/opd/verl/checkpoints/verl-dflash-opd/a3b-2node-forward/student-14-teacher-2-05-10/bsz-28-micro-1/train-mathcode16k_mbpp_user_prompt/global_step_2500/draft_model
    output_md: /mnt/shared-storage-user/leihaodi/diffusion/dflash/sglang-logs-final/gpu2.md
    dataset_name: ["aime24:30", "math500:128", "gsm8k:128", "mbpp:128", "humaneval:128", "aime25:30", "alpaca:128", "mt-bench:80", "mgsm_zh:32", "swe-bench:128"]
