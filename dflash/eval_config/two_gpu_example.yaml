  - name: gpu3
    gpu: 3
    target_model: /mnt/shared-storage-user/p1-shared/Qwen/Qwen3-30B-A3B-Thinking-2507
    draft_model: /mnt/shared-storage-user/leihaodi/opd/verl/checkpoints/verl-dflash-opd/a3b-2node-forward/student-14-teacher-2-05-10/bsz-28-micro-1/train-mathcode16k_mbpp_user_prompt/global_step_2000/draft_model
    output_md: /mnt/shared-storage-user/leihaodi/diffusion/dflash/sglang-logs-final/gpu3.md
